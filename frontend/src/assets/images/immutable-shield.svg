<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162947"/>
      <stop offset="100%" stop-color="#0a1221"/>
    </linearGradient>
    <!-- Inner Shadow for depth -->
    <radialGradient id="innerShadow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#050a12"/>
    </radialGradient>
    <!-- Gold Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ebd197"/>
      <stop offset="25%" stop-color="#c9a24b"/>
      <stop offset="75%" stop-color="#8a6c2d"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <!-- Gold Icon Fill Gradient -->
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2d0"/>
      <stop offset="40%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#8a6c2d"/>
    </linearGradient>
    <!-- Drop Shadow for Icon -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Border -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>
  
  <!-- Inner vignette -->
  <circle cx="50" cy="50" r="46" fill="url(#innerShadow)" />

  <!-- Shield with Checkmark -->
  <g filter="url(#iconShadow)">
    <!-- Shield Outline -->
    <path d="M 50 18 L 26 26 L 26 46 C 26 62 36 76 50 82 C 64 76 74 62 74 46 L 74 26 Z" fill="transparent" stroke="url(#iconGrad)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Checkmark -->
    <path d="M 38 50 L 46 58 L 62 40" fill="transparent" stroke="url(#iconGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
