<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162947"/>
      <stop offset="100%" stop-color="#0a1221"/>
    </linearGradient>
    <!-- Inner Shadow for depth -->
    <radialGradient id="innerShadow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#050a12"/>
    </radialGradient>
    <!-- Gold Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ebd197"/>
      <stop offset="25%" stop-color="#c9a24b"/>
      <stop offset="75%" stop-color="#8a6c2d"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <!-- Gold Icon Fill Gradient -->
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2d0"/>
      <stop offset="40%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#8a6c2d"/>
    </linearGradient>
    <!-- Drop Shadow for Icon -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Border -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>
  
  <!-- Inner vignette -->
  <circle cx="50" cy="50" r="46" fill="url(#innerShadow)" />

  <!-- Role Access Icon -->
  <g filter="url(#iconShadow)">
    <!-- Center Person -->
    <circle cx="50" cy="34" r="8" fill="transparent" stroke="url(#iconGrad)" stroke-width="4" />
    <path d="M 34 62 C 34 50 42 46 50 46 C 58 46 66 50 66 62" fill="transparent" stroke="url(#iconGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Left Person -->
    <circle cx="32" cy="40" r="6" fill="transparent" stroke="url(#iconGrad)" stroke-width="4" />
    <path d="M 22 62 C 22 52 28 48 34 48 C 36.5 48 38 49 39 50" fill="transparent" stroke="url(#iconGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Right Person -->
    <circle cx="68" cy="40" r="6" fill="transparent" stroke="url(#iconGrad)" stroke-width="4" />
    <path d="M 61 50 C 62 49 63.5 48 66 48 C 72 48 78 52 78 62" fill="transparent" stroke="url(#iconGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Settings Badge -->
    <circle cx="66" cy="66" r="14" fill="#0a1221" stroke="url(#iconGrad)" stroke-width="4" />
    <!-- Sliders -->
    <path d="M 58 60 L 70 60 M 62 66 L 74 66 M 58 72 L 70 72" stroke="url(#iconGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="66" cy="60" r="2.5" fill="url(#iconGrad)" />
    <circle cx="64" cy="66" r="2.5" fill="url(#iconGrad)" />
    <circle cx="68" cy="72" r="2.5" fill="url(#iconGrad)" />
  </g>
</svg>
