name: evault
services:
  postgres:
    image: "postgres:16-alpine"
    container_name: evault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evault
      POSTGRES_PASSWORD: evault_secret
      POSTGRES_DB: evault_db
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U evault -d evault_db
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - evault_app
  fabric-bootstrap:
    build:
      context: ./docker/fabric-bootstrap
      dockerfile: Dockerfile
    container_name: evault-fabric-bootstrap
    restart: no
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/eVault
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: evault-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fabric-bootstrap:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://evault:evault_secret@evault-postgres:5432/evault_db?schema=public"
      JWT_SECRET: change-me-to-a-long-random-secret
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      CORS_ORIGIN: "http://localhost:5173"
      EVAULT_ROOT: /eVault
      FABRIC_CRYPTO_PATH: /eVault/fabric/test-network/organizations/peerOrganizations/org1.example.com
      FABRIC_PEER_ENDPOINT: "peer0.org1.example.com:7051"
      FABRIC_PEER_HOST_ALIAS: peer0.org1.example.com
      FABRIC_CHANNEL_NAME: evaultchannel
      FABRIC_CHAINCODE_NAME: evaultcc
      FABRIC_MSP_ID: Org1MSP
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /app/storage_vault
    ports:
      - 3000:3000
    volumes:
      - ./fabric/test-network/organizations/peerOrganizations/org1.example.com:/eVault/fabric/test-network/organizations/peerOrganizations/org1.example.com:ro
      - storage_data:/app/storage_vault
      - uploads_data:/app/uploads
    networks:
      - evault_app
      - fabric_test



  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: evault-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - evault_app

networks:
  evault_app:
    name: evault_app
  fabric_test:
    external: true
volumes:
  postgres_data:
    external: true
    name: evault-backend_postgres_data
  storage_data:
    name: evault_storage_data
  uploads_data:
    name: evault_uploads_data
